name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build themes (audits contrast)
        run: pnpm build

      - run: pnpm typecheck

      - name: Package VSIX
        run: pnpm package:vscode

      - uses: actions/upload-artifact@v4
        with:
          name: inkstone
          path: dist/*.vsix
          if-no-files-found: error
