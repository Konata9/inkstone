name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from package.json "packageManager"; do not set `version` here.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build themes (audits contrast)
        run: pnpm build

      - run: pnpm typecheck

      - name: Package VSIX
        run: pnpm package:vscode

      - name: Assemble release assets
        run: pnpm package:release

      - uses: actions/upload-artifact@v4
        with:
          name: inkstone
          path: |
            dist/*.vsix
            dist/release/*
          if-no-files-found: error
